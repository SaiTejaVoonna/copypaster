      });
      langRow.appendChild(langLabel);
      langRow.appendChild(langSelect);
      body.appendChild(langRow);
    }

    if (item.type === "command") {
      const terminalWrap = document.createElement("div");
      terminalWrap.className = "terminal-wrap";
      const prompt = document.createElement("span");
      prompt.className = "terminal-prompt";
      prompt.textContent = promptForLanguage(item.language);
      terminalWrap.appendChild(prompt);
      terminalWrap.appendChild(textarea);
      body.appendChild(terminalWrap);
    } else {
      body.appendChild(textarea);
    }

    const varsRow = document.createElement("div");
    varsRow.id = "vars-row";
    function updateVarsRow() {
      const vars = extractPlaceholders(textarea.value);
      if (vars.length === 0) {
        varsRow.classList.add("hidden");
        varsRow.innerHTML = "";
        return;
      }
      varsRow.classList.remove("hidden");
      varsRow.innerHTML = '<span class="vars-row-label">Variables:</span>' +
        vars.map((v) => '<span class="var-chip">{{' + escapeHtml(v) + '}}</span>').join("");
    }
    updateVarsRow();
    textarea.addEventListener("input", updateVarsRow);
    body.appendChild(varsRow);

    // ---------- Auto-save (debounced) ----------
    // Persists title/content shortly after typing pauses. Deliberately does
    // NOT apply the "lock this Command" behavior that clicking Save does \u2014
    // autosave should never disable the field out from under someone mid-type.
    // Also deliberately avoids re-rendering the detail pane itself, so focus
    // and cursor position are never disturbed while typing.
    let autosaveTimer = null;
    function scheduleAutosave() {
      clearTimeout(autosaveTimer);
      if (autosaveStatusEl) autosaveStatusEl.textContent = "";
      autosaveTimer = setTimeout(async () => {
        const newTitle = titleInput.value.trim();
        const newContent = textarea.value;
        if (newTitle === (item.title || "") && newContent === item.content) return;
        item.title = newTitle;
        item.content = newContent;
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        renderAllViews();
        if (autosaveStatusEl) {
          autosaveStatusEl.textContent = "\u00b7 Saved";
          clearTimeout(autosaveStatusEl._fadeTimer);
          autosaveStatusEl._fadeTimer = setTimeout(() => { autosaveStatusEl.textContent = ""; }, 2500);
        }
      }, 700);
    }
    if (!titleInput.disabled) titleInput.addEventListener("input", scheduleAutosave);
    if (!textarea.disabled) textarea.addEventListener("input", scheduleAutosave);

    if (item.type === "clip" && !inTrash) {
      const expireRow = document.createElement("div");
      expireRow.id = "expire-row";
      const sw = document.createElement("div");
      sw.className = "switch" + (item.autoExpireAt ? " on" : "");
      const knob = document.createElement("div");
      knob.className = "switch-knob";
      sw.appendChild(knob);
      const label = document.createElement("span");
      label.textContent = item.autoExpireAt ? "Auto-deletes " + timeAgo(item.autoExpireAt).replace(" ago", "") : "Auto-delete this clip";
      const durationSelect = document.createElement("select");
      durationSelect.id = "expire-duration";
      [["1", "1 hour"], ["24", "24 hours"], ["168", "7 days"]].forEach(([hrs, text]) => {
        const opt = document.createElement("option");
        opt.value = hrs; opt.textContent = text;
        durationSelect.appendChild(opt);
      });
      durationSelect.style.display = item.autoExpireAt ? "none" : "inline-block";
      sw.addEventListener("click", async () => {
        if (item.autoExpireAt) { item.autoExpireAt = null; }
        else { item.autoExpireAt = Date.now() + parseInt(durationSelect.value, 10) * 60 * 60 * 1000; }
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        openDetail(item.id);
      });
      // Expiry state lives only on the item itself \u2014 no sidebar counts change here.
      expireRow.appendChild(sw);
      expireRow.appendChild(label);
      expireRow.appendChild(durationSelect);
      body.appendChild(expireRow);
    }

    if (!inTrash) {
      const folderRow = document.createElement("div");
      folderRow.className = "field-row";
      const folderLabel = document.createElement("span");
      folderLabel.textContent = "Folder:";
      const folderSelect = document.createElement("select");
      const noneOpt = document.createElement("option");
      noneOpt.value = "";
      noneOpt.textContent = "No folder";
      folderSelect.appendChild(noneOpt);
      folderCache.filter((f) => !f.parentId).forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = f.name;
        if (item.folderId === f.id) opt.selected = true;
        folderSelect.appendChild(opt);
        folderCache.filter((sf) => sf.parentId === f.id).forEach((sf) => {
          const subOpt = document.createElement("option");
          subOpt.value = sf.id;
          subOpt.textContent = "\u2003↳ " + sf.name;
          if (item.folderId === sf.id) subOpt.selected = true;
          folderSelect.appendChild(subOpt);
        });
      });
      folderSelect.addEventListener("change", async () => {
        item.folderId = folderSelect.value || null;
        if (item.folderId) item.order = Date.now();
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        renderFoldersList();
      });
      folderRow.appendChild(folderLabel);
      folderRow.appendChild(folderSelect);
      body.appendChild(folderRow);

      const tagsRow = document.createElement("div");
      tagsRow.id = "tags-row";
      for (const tid of item.tags) {
        const t = tagById(tid);
        if (!t) continue;
        const chip = document.createElement("div");
        chip.className = "tag-chip";
        const marker = t.emoji ? '<span class="tag-emoji">' + t.emoji + '</span>' : '<span class="tag-dot" style="background:' + t.color + '"></span>';
        chip.innerHTML = marker + escapeHtml(t.name);
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", async () => {
          item.tags = item.tags.filter((x) => x !== tid);
          item.updatedAt = Date.now();
          await put(ITEMS_STORE, item);
          renderTagsList();
          openDetail(item.id);
        });
        chip.appendChild(removeBtn);
        tagsRow.appendChild(chip);
      }
      const addTagBtn = document.createElement("button");
      addTagBtn.id = "add-tag-to-item-btn";
      addTagBtn.textContent = "+ Tag";
      addTagBtn.addEventListener("click", (e) => openTagAssignPopover(e, item));
      tagsRow.appendChild(addTagBtn);
      body.appendChild(tagsRow);

      const colorRow = document.createElement("div");
      colorRow.className = "field-row";
      const colorLabel = document.createElement("span");
      colorLabel.textContent = "Color:";
      colorRow.appendChild(colorLabel);
      const noneSwatch = document.createElement("div");
      noneSwatch.className = "swatch color-none" + (!item.color ? " selected" : "");
      noneSwatch.title = "No color";
      noneSwatch.addEventListener("click", async () => {
        item.color = null;
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        openDetail(item.id);
      });
      colorRow.appendChild(noneSwatch);
      SWATCHES.forEach((color) => {
        const sw = document.createElement("div");
        sw.className = "swatch" + (item.color === color ? " selected" : "");
        sw.style.background = color;
        sw.addEventListener("click", async () => {
          item.color = color;
          item.updatedAt = Date.now();
          await put(ITEMS_STORE, item);
          openDetail(item.id);
        });
        colorRow.appendChild(sw);
      });
      body.appendChild(colorRow);
    }

    const footer = document.createElement("div");
    footer.id = "detail-footer";
    const meta = document.createElement("div");
    meta.id = "detail-meta";
    meta.textContent = "Added " + formatFullDate(item.createdAt) + (inTrash ? " \u00b7 Deleted " + formatFullDate(item.deletedAt) : "");
    let autosaveStatusEl = null;
    if (!inTrash) {
      autosaveStatusEl = document.createElement("span");
      autosaveStatusEl.id = "autosave-status";
      meta.appendChild(autosaveStatusEl);
    }
    const actions = document.createElement("div");
    actions.id = "detail-actions";

    if (inTrash) {
      const restoreBtn = document.createElement("button");
      restoreBtn.className = "action primary";
      restoreBtn.textContent = "Restore";
      restoreBtn.addEventListener("click", async () => {
        item.deletedAt = null;
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        closeDetail();
        renderAllViews();
        showToast("Restored");
      });
      const forgetBtn = document.createElement("button");
      forgetBtn.className = "action danger";
      forgetBtn.textContent = "Delete forever";
      forgetBtn.addEventListener("click", async () => {
        await remove(ITEMS_STORE, item.id);
        cache = cache.filter((i) => i.id !== item.id);
        closeDetail();
        renderAllViews();
        showToast("Deleted permanently");
      });
      actions.appendChild(restoreBtn);
      actions.appendChild(forgetBtn);
    } else {
      const delBtn = document.createElement("button");
      delBtn.className = "action danger";
      delBtn.innerHTML = icon("trash") + " Delete";
      delBtn.title = "Move to Trash (not permanent)";
      delBtn.addEventListener("click", async () => {
        item.deletedAt = Date.now();
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        closeDetail();
        renderAllViews();
        showToast("Moved to Trash");
      });
      const copyBtn = document.createElement("button");
      copyBtn.className = "action";
      copyBtn.innerHTML = icon("copy") + " Copy";
      copyBtn.title = "Copy to clipboard";
      copyBtn.addEventListener("click", () => {
        copyItemSmart(item, textarea ? textarea.value : item.content);
      });

      const pasteFooterBtn = document.createElement("button");
      pasteFooterBtn.className = "action";
      pasteFooterBtn.innerHTML = icon("paste") + " Paste";
      pasteFooterBtn.title = "Paste from clipboard into this item";
      pasteFooterBtn.disabled = inTrash;
      pasteFooterBtn.addEventListener("click", async () => {
        try {
          if (!navigator.clipboard || !navigator.clipboard.read) throw new Error("Clipboard read API unavailable");
          const clipboardItems = await navigator.clipboard.read();
          for (const ci of clipboardItems) {
            const imageType = ci.types.find((t) => t.startsWith("image/"));
            if (imageType) {
              const blob = await ci.getType(imageType);
              const dataUrl = await dataUrlFromBlob(blob);
              convertStandaloneImageToGallery(item);
              item.images.push(dataUrl);
              item.updatedAt = Date.now();
              await put(ITEMS_STORE, item);
              openDetail(item.id);
              showToast("Image pasted into this item");
              return;
            }
          }
          if (navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && text.trim() && textarea && !textarea.disabled) {
              const start = textarea.selectionStart;
              const end = textarea.selectionEnd;
              const val = textarea.value;
              textarea.value = val.slice(0, start) + text + val.slice(end);
              const newPos = start + text.length;
              textarea.selectionStart = textarea.selectionEnd = newPos;
              textarea.focus();
              textarea.dispatchEvent(new Event("input", { bubbles: true }));
              showToast("Pasted");
              return;
            }
          }
          showToast("Clipboard is empty, unreadable, or this field is locked");
        } catch (err) {
          console.error("Clipboard read failed:", err);
          showToast("Clipboard read blocked: " + (err.name || err.message || "unknown error") + " \u2014 try Ctrl/Cmd+V instead");
        }
      });

      const saveBtn = document.createElement("button");
      saveBtn.className = "action primary";
      saveBtn.innerHTML = icon("check") + " Save";
      saveBtn.title = "Save changes";
      saveBtn.disabled = textarea ? textarea.disabled : false;
      saveBtn.addEventListener("click", async () => {
        item.title = titleInput.value.trim();
        if (textarea) item.content = textarea.value;
        const justLocked = item.type === "command" && !item.locked && item.content && item.content.trim();
        if (justLocked) item.locked = true;
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        if (justLocked) { renderAllViews(); openDetail(item.id); }
        else renderAllViews();
        showToast("Saved");
      });
      actions.appendChild(delBtn);
      actions.appendChild(copyBtn);
      actions.appendChild(pasteFooterBtn);
      actions.appendChild(saveBtn);
    }

    footer.appendChild(meta);
    footer.appendChild(actions);
    detailPane.appendChild(header);
    detailPane.appendChild(body);
    detailPane.appendChild(footer);
  }

  async function closeDetail(fromPopState = false) {
    await saveOpenDraft();
    currentId = null;
    detailPane.classList.remove("open");
    detailPane.innerHTML = '<div id="placeholder">Select an item, or create a new one</div>';
    renderList();
    // Closed by the UI (← button, Escape, delete...) rather than the phone's
    // back button: pop our history entry so the next back press leaves
    // nothing stale behind.
    if (!fromPopState && history.state && history.state.cpDetail) {
      ignoreNextPopState = true;
      history.back();
    }
  }

  // ---------- Mobile back button ----------
  // On phones the detail pane covers the list, so the hardware/gesture back
  // button should close it instead of leaving the app. Opening the pane
  // pushes one history entry (only one, however many items get opened in a
  // row); popstate closes the pane.
  const mobileLayout = window.matchMedia("(max-width: 720px)");
  let ignoreNextPopState = false;

  function pushDetailHistory() {
    if (!mobileLayout.matches) return;
    if (history.state && history.state.cpDetail) return;
    history.pushState({ cpDetail: true }, "");
  }

  window.addEventListener("popstate", () => {
    if (ignoreNextPopState) {
      ignoreNextPopState = false;
      // Something reopened the pane before our own history.back() landed.
      if (detailPane.classList.contains("open")) pushDetailHistory();
      return;
    }
    if (!detailPane.classList.contains("open")) return;
    const placeholderModal = document.getElementById("placeholder-modal-overlay");
    if (placeholderModal) placeholderModal.remove();
    if (document.getElementById("image-lightbox")) closeImageLightbox();
    closeAnyPopover();
    document.body.classList.remove("zen-mode");
    closeDetail(true);
  });

  function openTagAssignPopover(anchorEvent, item) {
    closeAnyPopover();
    const pop = document.createElement("div");
    pop.className = "popover";
    const list = document.createElement("div");
    list.className = "popover-list";

    if (tagCache.length === 0) {
      const empty = document.createElement("div");
      empty.style.fontSize = "12px";
      empty.style.color = "var(--text-dim)";
      empty.style.padding = "4px 6px";
      empty.textContent = "No tags yet. Create one from the sidebar.";
      list.appendChild(empty);
    }
    for (const tag of tagCache) {
      const row = document.createElement("div");
      const checked = item.tags.includes(tag.id);
      row.className = "popover-list-item" + (checked ? " checked" : "");
      const marker = tag.emoji ? '<span class="tag-emoji">' + tag.emoji + '</span>' : '<span class="tag-dot" style="background:' + tag.color + '"></span>';
      row.innerHTML = marker + escapeHtml(tag.name);
      row.addEventListener("click", async () => {
        item.tags = item.tags.includes(tag.id) ? item.tags.filter((x) => x !== tag.id) : item.tags.concat(tag.id);
        item.updatedAt = Date.now();
        await put(ITEMS_STORE, item);
        closeAnyPopover();
        renderTagsList();
        openDetail(item.id);
      });
      list.appendChild(row);
    }
    pop.appendChild(list);
    document.body.appendChild(pop);
    positionPopover(pop, anchorEvent.target);
  }

  // ---------- Export / Import ----------

  document.getElementById("export-btn").addEventListener("click", () => {
    const payload = {
      cpsVersion: 1,
      exportedAt: new Date().toISOString(),
      items: cache,
      tags: tagCache,
      folders: folderCache
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "copypaster-export-" + stamp + ".cps";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Exported");
  });

  document.getElementById("import-btn").addEventListener("click", () => {
    document.getElementById("import-file").click();
  });

  document.getElementById("import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data.cpsVersion !== "number") throw new Error("Not a recognized .cps file");

      const existingItemIds = new Set(cache.map((i) => i.id));
      const existingTagIds = new Set(tagCache.map((t) => t.id));
      const existingFolderIds = new Set(folderCache.map((f) => f.id));

      let addedItems = 0, addedTags = 0, addedFolders = 0;

      for (const folder of (data.folders || [])) {
        if (!folder.id || existingFolderIds.has(folder.id)) continue;
        await put(FOLDERS_STORE, folder);
        folderCache.push(folder);
        addedFolders++;
      }
      for (const tag of (data.tags || [])) {
        if (!tag.id || existingTagIds.has(tag.id)) continue;
        await put(TAGS_STORE, tag);
        tagCache.push(tag);
        addedTags++;
      }
      for (const item of (data.items || [])) {
        if (!item.id || existingItemIds.has(item.id)) continue;
        const normalized = normalize(item);
        convertStandaloneImageToGallery(normalized);
        await put(ITEMS_STORE, normalized);
        cache.push(normalized);
        addedItems++;
      }

      renderAllViews();
      showToast("Imported " + addedItems + " items" + (addedTags || addedFolders ? " (+tags/folders)" : ""));
    } catch (err) {
      console.error("Import failed:", err);
      showToast("Import failed \u2014 not a valid .cps file");
    }
  });

  // ---------- New item ----------

  document.getElementById("new-btn").addEventListener("click", async () => {
    await saveOpenDraft();
    const item = normalize({ id: uuid(), type: "clip", content: "", createdAt: Date.now(), updatedAt: Date.now() });
    await put(ITEMS_STORE, item);
    cache.push(item);
    renderAllViews();
    openDetail(item.id);
    const ta = document.getElementById("content-input");
    if (ta) ta.focus();
  });

  // ---------- Search ----------

  // ---------- Multi-select & bulk actions ----------

  document.getElementById("select-mode-btn").addEventListener("click", () => {
    selectMode = !selectMode;
    document.getElementById("select-mode-btn").classList.toggle("active", selectMode);
    if (!selectMode) selectedIds.clear();
    renderList();
    updateBulkBar();
  });

  function updateSelectAllRow() {
    const row = document.getElementById("select-all-row");
    if (!selectMode || visibleIds.length === 0) { row.classList.add("hidden"); return; }
    row.classList.remove("hidden");
    const selectedVisibleCount = visibleIds.filter((id) => selectedIds.has(id)).length;
    const checkbox = document.getElementById("select-all-checkbox");
    checkbox.checked = selectedVisibleCount === visibleIds.length;
    checkbox.indeterminate = selectedVisibleCount > 0 && selectedVisibleCount < visibleIds.length;
    document.getElementById("select-all-label").textContent =
      selectedVisibleCount > 0 ? "Select all (" + selectedVisibleCount + " of " + visibleIds.length + ")" : "Select all " + visibleIds.length + " items";
  }

  document.getElementById("select-all-checkbox").addEventListener("click", (e) => {
    const allSelected = visibleIds.every((id) => selectedIds.has(id));
    if (allSelected) {
      visibleIds.forEach((id) => selectedIds.delete(id));
    } else {
      visibleIds.forEach((id) => selectedIds.add(id));
    }
    renderList();
    updateBulkBar();
  });

  function updateBulkBar() {
    const bar = document.getElementById("bulk-bar");
    if (!selectMode || selectedIds.size === 0) { bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden");
    document.getElementById("bulk-count").textContent = selectedIds.size + " selected";

    const folderSelect = document.getElementById("bulk-folder-select");
    folderSelect.innerHTML = '<option value="">Move to folder\u2026</option>';
    folderCache.filter((f) => !f.parentId).forEach((f) => {
      const opt = document.createElement("option");
      opt.value = f.id;
      opt.textContent = f.name;
      folderSelect.appendChild(opt);
      folderCache.filter((sf) => sf.parentId === f.id).forEach((sf) => {
        const subOpt = document.createElement("option");
        subOpt.value = sf.id;
        subOpt.textContent = "\u2003↳ " + sf.name;
        folderSelect.appendChild(subOpt);
      });
    });
  }

  document.getElementById("bulk-tag-btn").addEventListener("click", (e) => {
    closeAnyPopover();
    const pop = document.createElement("div");
    pop.className = "popover has-close";

    const closeBtn = document.createElement("button");
    closeBtn.className = "popover-close-btn";
    closeBtn.textContent = "\u2715";
    closeBtn.title = "Close";
    closeBtn.addEventListener("click", () => closeAnyPopover());
    pop.appendChild(closeBtn);

    const label = document.createElement("div");
    label.className = "popover-label";
    label.textContent = "Add tag to " + selectedIds.size + " selected item(s)";
    pop.appendChild(label);

    const list = document.createElement("div");
    list.className = "popover-list";
    if (tagCache.length === 0) {
      const empty = document.createElement("div");
      empty.style.fontSize = "12px";
      empty.style.color = "var(--text-dim)";
      empty.style.padding = "4px 6px";
      empty.textContent = "No tags yet. Create one from the sidebar.";
      list.appendChild(empty);
    }
    for (const tag of tagCache) {
      const row = document.createElement("div");
      row.className = "popover-list-item";
      const marker = tag.emoji
        ? '<span class="tag-emoji">' + tag.emoji + '</span>'
        : '<span class="tag-dot" style="background:' + tag.color + '"></span>';
      row.innerHTML = marker + escapeHtml(tag.name);
      row.addEventListener("click", async () => {
        for (const id of selectedIds) {
          const item = cache.find((i) => i.id === id);
          if (!item) continue;
          if (!item.tags.includes(tag.id)) {
            item.tags = item.tags.concat(tag.id);
            item.updatedAt = Date.now();
            await put(ITEMS_STORE, item);
          }

        showToast("Added \u201c" + tag.name + "\u201d to " + selectedIds.size + " items");
        renderAllViews();

  document.getElementById("bulk-folder-select").addEventListener("change", async (e) => {
    const folderId = e.target.value;
    if (!folderId) return;
    for (const id of selectedIds) {
      const item = cache.find((i) => i.id === id);
      if (!item) continue;
      item.folderId = folderId;
      item.order = Date.now();
      item.updatedAt = Date.now();

  document.getElementById("bulk-delete-btn").addEventListener("click", async () => {
    if (!confirm("Move " + selectedIds.size + " item(s) to Trash?")) return;
    for (const id of selectedIds) {
      const item = cache.find((i) => i.id === id);
      if (!item) continue;
      item.deletedAt = Date.now();
      item.updatedAt = Date.now();
      await put(ITEMS_STORE, item);
    }
    showToast("Moved " + selectedIds.size + " items to Trash");
    selectedIds.clear();
    renderAllViews();
    updateBulkBar();

    renderList();
    updateBulkBar();

  document.getElementById("search-input").addEventListener("input", (e) => {
    searchQuery = e.target.value.trim();
    renderList();

  const sortSelect = document.getElementById("sort-select");
  sortSelect.value = sortMode;
  sortSelect.addEventListener("change", () => {
    sortMode = sortSelect.value;
    localStorage.setItem(SORT_MODE_KEY, sortMode);
    renderList();
  });

  // ---------- Paste-to-quick-add ----------

  function dataUrlFromBlob(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  document.getElementById("attach-image-file").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length || !currentId) return;
    const item = cache.find((i) => i.id === currentId);
    if (!item) return;
    convertStandaloneImageToGallery(item);
    let addedCount = 0;
    for (const file of files) {
      const dataUrl = await dataUrlFromBlob(file).catch((err) => { console.error("Attach image failed:", err); return null; });
      if (dataUrl) { item.images.push(dataUrl); addedCount++; }
    }
    if (!addedCount) { showToast("Could not read that image"); return; }
    item.updatedAt = Date.now();
    await put(ITEMS_STORE, item);
    openDetail(item.id);
    showToast(addedCount > 1 ? addedCount + " images attached" : "Image attached");
  });

  // Prevent data loss: if an item is open with unsaved edits and something
  // (like a paste) is about to navigate the detail pane to a different item,
  // save those edits first instead of silently discarding them.
  // ---------- Image lightbox ----------

  function openImageLightbox(src, item, idx) {
    closeImageLightbox();
    const overlay = document.createElement("div");
    overlay.id = "image-lightbox";
    const img = document.createElement("img");
    img.src = src;
    const closeBtn = document.createElement("button");
    closeBtn.id = "image-lightbox-close";
    closeBtn.textContent = "✕";
    closeBtn.title = "Close";
    closeBtn.addEventListener("click", closeImageLightbox);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeImageLightbox(); });
    overlay.appendChild(img);
    overlay.appendChild(closeBtn);

    const actions = document.createElement("div");
    actions.id = "image-lightbox-actions";
    const downloadBtn = document.createElement("button");
    downloadBtn.className = "image-lightbox-btn";
    downloadBtn.innerHTML = icon("download") + " Download";
    downloadBtn.addEventListener("click", () => downloadImage(src, item, idx));
    actions.appendChild(downloadBtn);
    if (item && !item.deletedAt) {
      const deleteBtn = document.createElement("button");
      deleteBtn.className = "image-lightbox-btn danger";
      deleteBtn.innerHTML = icon("trash") + " Delete";
      deleteBtn.addEventListener("click", async () => {
        if (await deleteAttachedImage(item, idx)) closeImageLightbox();
      });
      actions.appendChild(deleteBtn);
    }
    overlay.appendChild(actions);
    document.body.appendChild(overlay);
  }

  function imageFileName(dataUrl, item, idx) {
    const mime = (dataUrl.match(/^data:([^;,]+)/) || [])[1] || "image/png";
    const ext = { "image/jpeg": "jpg", "image/svg+xml": "svg" }[mime] || mime.split("/")[1] || "png";
    const base = ((item && item.title) || "copypaster-image").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "-").slice(0, 60) || "copypaster-image";
    const suffix = item && item.images && item.images.length > 1 ? "-" + (idx + 1) : "";
    return base + suffix + "." + ext;
  }

  async function downloadImage(dataUrl, item, idx) {
    const fileName = imageFileName(dataUrl, item, idx);
    try {
      const blob = await (await fetch(dataUrl)).blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showToast("Downloading " + fileName);
    } catch (err) {
      console.error("Image download failed:", err);
      showToast("Couldn't download \u2014 long-press the image to save it");
    }
  }

  async function deleteAttachedImage(item, idx) {
    if (!confirm("Delete this image? This can't be undone.")) return false;
    item.images.splice(idx, 1);
    item.updatedAt = Date.now();
    await put(ITEMS_STORE, item);
    openDetail(item.id);
    showToast("Image deleted");
    return true;
  }

  function closeImageLightbox() {
    const existing = document.getElementById("image-lightbox");
    if (existing) existing.remove();
  }

  // Old items created before the gallery model existed are stuck as a single
  // rigid whole-image with no text field and no room for more images. The
  // first time someone tries to add another image to one, convert it in
  // place: move its one image into the gallery array, free up the text field.
  function convertStandaloneImageToGallery(item) {
    if (item.contentType === "image" && item.content) {
      item.images = item.images || [];
      if (!item.images.includes(item.content)) item.images.unshift(item.content);
      item.content = "";
      item.contentType = "text";
    }
  }

  async function saveOpenDraft() {
    if (!currentId) return;
    const item = cache.find((i) => i.id === currentId);
    if (!item) return;
    const titleField = document.getElementById("title-input");
    const contentField = document.getElementById("content-input");
    let changed = false;
    if (titleField && titleField.value.trim() !== (item.title || "")) {
      item.title = titleField.value.trim();
      changed = true;
    }
    if (contentField && contentField.value !== item.content) {
      item.content = contentField.value;
      changed = true;
    }
    if (changed) {
      item.updatedAt = Date.now();
      await put(ITEMS_STORE, item);
    }
  }

  async function addImageItem(dataUrl, toastMsg) {
    console.log("[CopyPaster] image data URL length:", dataUrl.length, "chars (~" + Math.round(dataUrl.length * 0.75 / 1024) + "KB)");
    await saveOpenDraft();
    const item = normalize({ id: uuid(), type: "clip", content: "", images: [dataUrl], createdAt: Date.now(), updatedAt: Date.now() });
    await put(ITEMS_STORE, item);
    cache.push(item);
    renderAllViews();
    openDetail(item.id);
    const titleField = document.getElementById("title-input");
    if (titleField) titleField.focus();
    showToast(toastMsg || "Pasted as new clip \u2014 paste again to add more images");
  }

  async function addTextItem(text, toastMsg) {
    await saveOpenDraft();
    const item = normalize({ id: uuid(), type: "clip", content: text, createdAt: Date.now(), updatedAt: Date.now() });
    await put(ITEMS_STORE, item);
    cache.push(item);
    renderAllViews();
    openDetail(item.id);
    const contentField = document.getElementById("content-input");
    if (contentField) contentField.focus();
    showToast(toastMsg || "Pasted as new clip");
  }

  document.addEventListener("paste", async (e) => {
    if (e.target && (e.target.id === "content-input" || e.target.tagName === "INPUT")) return;

    const clipItems = e.clipboardData ? e.clipboardData.items : null;
    const availableTypes = clipItems ? Array.from(clipItems).map((ci) => ci.type) : [];
    console.log("[CopyPaster] paste event fired. Clipboard item types:", availableTypes);

    let imageFile = null;
    if (clipItems) {
      for (const ci of clipItems) {
        if (ci.type && ci.type.startsWith("image/")) { imageFile = ci.getAsFile(); break; }
      }
    }
    if (!imageFile && e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
      const f = e.clipboardData.files[0];
      console.log("[CopyPaster] falling back to clipboardData.files:", f.type, f.name);
      if (f.type && f.type.startsWith("image/")) imageFile = f;
    }

    if (imageFile) {
      e.preventDefault();
      const dataUrl = await dataUrlFromBlob(imageFile).catch((err) => { console.error("Image read failed:", err); return null; });
      if (!dataUrl) { showToast("Could not read pasted image"); return; }

      const openItem = currentId ? cache.find((i) => i.id === currentId) : null;
      if (openItem && !openItem.deletedAt) {
        // A note/snippet/command is already open \u2014 attach here instead of
        // surprising the person with a brand-new item switching them away
        // from what they were writing. If this is an old rigid standalone
        // image item, convert it to the flexible gallery format first.
        convertStandaloneImageToGallery(openItem);
        openItem.images.push(dataUrl);
        openItem.updatedAt = Date.now();
        await put(ITEMS_STORE, openItem);
        openDetail(openItem.id);
        showToast("Image attached to this item");
        return;
      }

      await addImageItem(dataUrl);
      return;
    }

    const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
    if (text && text.trim()) {
      e.preventDefault();
      await addTextItem(text);
      return;
    }

    // Paste fired but nothing usable was on the clipboard \u2014 say so instead of doing nothing.
    e.preventDefault();
    if (availableTypes.length === 0) {
      showToast("Clipboard looks empty to the browser (check console)");
    } else {
      showToast("No image or text found \u2014 types on clipboard: " + availableTypes.join(", "));
    }
  });

  // Explicit Paste button: uses the async Clipboard read API instead of the
  // keyboard paste event. More reliable for screenshots/Snipping Tool output,
  // since it doesn't depend on which element in the page has focus.
  document.getElementById("paste-btn").addEventListener("click", async () => {
    showToast("Reading clipboard\u2026");
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        throw new Error("Clipboard read API unavailable in this browser/context");
      }
      const clipboardItems = await navigator.clipboard.read();
      for (const ci of clipboardItems) {
        const imageType = ci.types.find((t) => t.startsWith("image/"));
        if (imageType) {
          const blob = await ci.getType(imageType);
          const dataUrl = await dataUrlFromBlob(blob);

          const openItem = currentId ? cache.find((i) => i.id === currentId) : null;
          if (openItem && !openItem.deletedAt) {
            convertStandaloneImageToGallery(openItem);
            openItem.images.push(dataUrl);
            openItem.updatedAt = Date.now();
            await put(ITEMS_STORE, openItem);
            openDetail(openItem.id);
            showToast("Image attached to this item");
            return;
          }

          await addImageItem(dataUrl, "Pasted image from clipboard");
          return;
        }
      }
      if (navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) { await addTextItem(text, "Pasted from clipboard"); return; }
      }
      showToast("Clipboard is empty or in an unreadable format (check console)");
    } catch (err) {
      console.error("Clipboard read failed:", err);
      showToast("Clipboard read blocked: " + (err.name || err.message || "unknown error") + " \u2014 try Ctrl/Cmd+V instead");
    }
  });

  // ---------- Keyboard shortcuts ----------

  document.addEventListener("keydown", (e) => {
    const active = document.activeElement;
    const inTextField = active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT");

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      const search = document.getElementById("search-input");
      search.focus();
      search.select();
      return;
    }

    if (e.key === "Escape") {
      const placeholderModal = document.getElementById("placeholder-modal-overlay");
      if (placeholderModal) { placeholderModal.remove(); return; }
      if (document.getElementById("image-lightbox")) { closeImageLightbox(); return; }
      if (inTextField && active.id === "content-input") { active.blur(); return; }
      const openPopover = document.querySelector(".popover");
      if (openPopover) { closeAnyPopover(); return; }
      if (document.body.classList.contains("zen-mode")) { document.body.classList.remove("zen-mode"); return; }
      if (detailPane.classList.contains("open")) { closeDetail(); }
      return;
    }

    // Arrow keys move a highlight through the visible list \u2014 doesn't touch
    // typing in any text field, and doesn't fight the browser over Tab.
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !inTextField && !document.querySelector(".popover") && !document.getElementById("placeholder-modal-overlay")) {
      if (!visibleIds.length) return;
      e.preventDefault();
      let idx = visibleIds.indexOf(keyboardHighlightId);
      if (e.key === "ArrowDown") idx = idx === -1 ? 0 : Math.min(visibleIds.length - 1, idx + 1);
      else idx = idx === -1 ? visibleIds.length - 1 : Math.max(0, idx - 1);
      keyboardHighlightId = visibleIds[idx];
      renderList();
      const highlighted = document.querySelector(".item-row.kbd-highlight");
      if (highlighted) highlighted.scrollIntoView({ block: "nearest" });
      return;
    }

    if (e.key === "Enter" && !inTextField && keyboardHighlightId && !document.querySelector(".popover")) {
      e.preventDefault();
      openDetail(keyboardHighlightId);
      return;
    }

    // 1-9: instantly copy the Nth visible item without opening it.
    if (/^[1-9]$/.test(e.key) && !inTextField && !e.ctrlKey && !e.metaKey && !e.altKey && !document.querySelector(".popover") && !document.getElementById("placeholder-modal-overlay")) {
      const idx = parseInt(e.key, 10) - 1;
      if (visibleIds[idx]) {
        const it = cache.find((i) => i.id === visibleIds[idx]);
        if (it) { e.preventDefault(); copyItemSmart(it); }
      }
      return;
    }
  });

  // ---------- Mobile sidebar ----------

  document.getElementById("menu-btn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });
  function closeSidebarOnMobile() { document.getElementById("sidebar").classList.remove("open"); }

  // ---------- Boot ----------

  openDB()
    .then(async (database) => {
      db = database;
      await refresh();
      await sweepExpired();
      setInterval(sweepExpired, 60 * 1000);
    })
    .catch((err) => {
      itemsEl.innerHTML = "";
      const errBox = document.createElement("div");
      errBox.id = "empty-state";
      errBox.style.color = "var(--danger)";
      errBox.textContent = "Could not open local database: " + err.message;
      itemsEl.appendChild(errBox);
      console.error("IndexedDB error:", err);
    });
})();
</script>

</body>
</html>
